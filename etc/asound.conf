}
# the two monitor mix channels of each card included (11/12 and 23/24)

# everything: 20 playback channels, digital outputs 9/10 of each card
pcm.p88x2all_out {
	type multi
	slaves {
		a {
			pcm "hw:Phase88"
			channels 10
		}
		b {
			pcm "hw:Phase88_1"
			channels 10
		}
	}
	bindings {
		0  { slave a channel 0 }
		1  { slave a channel 1 }
		2  { slave a channel 2 }
		3  { slave a channel 3 }
		4  { slave a channel 4 }
		5  { slave a channel 5 }
		6  { slave a channel 6 }
		7  { slave a channel 7 }
		8  { slave a channel 8 }
		9  { slave a channel 9 }
		10 { slave b channel 0 }
		11 { slave b channel 1 }
		12 { slave b channel 2 }
		13 { slave b channel 3 }
		14 { slave b channel 4 }
		15 { slave b channel 5 }
		16 { slave b channel 6 }
		17 { slave b channel 7 }
		18 { slave b channel 8 }
		19 { slave b channel 9 }
	}
}

pcm.phase88x2all {
	type asym
	capture.pcm "p88x2all_in"
	playback.pcm "p88x2all_out"
}

# A combined device has no mixer of its own, and jackd always tries to open a
# control handle with the same name as the PCM it was given, which produced
#
#   ALSA lib control.c:1575:(snd_ctl_open_noupdate) Invalid CTL phase88x2
#   control open "phase88x2" (No such file or directory)
#
# in every jackd log.  It is harmless - only the optional mixer access fails -
# but it looks like a fault and buries the lines that matter.  Pointing the
# control name at the first card makes the message go away and gives jackd a
# real (if partial) mixer handle plus the D-Bus card reservation for that card.
ctl.phase88x2 {
	type hw
	card "Phase88"
}
ctl.phase88x2all {
	type hw
	card "Phase88"
}
