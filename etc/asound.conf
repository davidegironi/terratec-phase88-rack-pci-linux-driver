# Two TerraTec PHASE 88 cards as one ALSA device.
#
# Only the named devices below are added: pcm.!default is untouched, so the
# desktop, PulseAudio and plain hw: access behave exactly as before.
#
#   card 0 = hw:Phase88   = PCI 0000:03:01.0
#   card 1 = hw:Phase88_1 = PCI 0000:03:02.0
#
# One PHASE 88 exposes 12 capture channels (1..8 analog inputs of its rack,
# 9/10 phantom AC97, 11/12 Envy24 monitor mix) and 10 playback channels
# (1..8 analog outputs, 9/10 digital).  rate and format are deliberately not
# pinned: the application asks for them and the multi plugin passes them to
# both cards, which are identical hardware.
#
# Which rack is which here: 'a' = hw:Phase88 = PCI 03:01.0 = the card whose
# SYNC IN is fed = the CLOCK SLAVE, its channels are the low numbers;
# 'b' = hw:Phase88_1 = PCI 03:02.0 = the card that puts its clock on the cable
# = the MASTER, its channels are the high numbers.
#
#   jackd -d alsa -d phase88x2 -r 48000 -p 1024
#
# makes one JACK server with system:capture_1..16 and system:playback_1..16:
# 1..8 on the clock slave (the newly added board), 9..16 on the clock master
# (the original board and rack).  That is only sane with the sync cable in and
# the slave programmed to take the external clock, which
# phase88-sync-setup.sh does at boot from /etc/default/phase88;
# phase88-sync-follow.sh is what proved the cable really carries the clock.

# 16 capture channels: the 8 analog inputs of each rack
pcm.p88x2_in {
	type multi
	slaves {
		a {
			pcm "hw:Phase88"
			channels 12
		}
		b {
			pcm "hw:Phase88_1"
			channels 12
		}
	}
	bindings {
		0  { slave a channel 0 }
		1  { slave a channel 1 }
		2  { slave a channel 2 }
		3  { slave a channel 3 }
		4  { slave a channel 4 }
		5  { slave a channel 5 }
		6  { slave a channel 6 }
		7  { slave a channel 7 }
		8  { slave b channel 0 }
		9  { slave b channel 1 }
		10 { slave b channel 2 }
		11 { slave b channel 3 }
		12 { slave b channel 4 }
		13 { slave b channel 5 }
		14 { slave b channel 6 }
		15 { slave b channel 7 }
	}
}

# 16 playback channels: the 8 analog outputs of each rack
pcm.p88x2_out {
	type multi
	slaves {
		a {
			pcm "hw:Phase88"
			channels 10
		}
		b {
			pcm "hw:Phase88_1"
			channels 10
		}
	}
	bindings {
		0  { slave a channel 0 }
		1  { slave a channel 1 }
		2  { slave a channel 2 }
		3  { slave a channel 3 }
		4  { slave a channel 4 }
		5  { slave a channel 5 }
		6  { slave a channel 6 }
		7  { slave a channel 7 }
		8  { slave b channel 0 }
		9  { slave b channel 1 }
		10 { slave b channel 2 }
		11 { slave b channel 3 }
		12 { slave b channel 4 }
		13 { slave b channel 5 }
		14 { slave b channel 6 }
		15 { slave b channel 7 }
	}
}

pcm.phase88x2 {
	type asym
	capture.pcm "p88x2_in"
	playback.pcm "p88x2_out"
}

# everything: 24 capture channels, the two silent AC97 slots and
