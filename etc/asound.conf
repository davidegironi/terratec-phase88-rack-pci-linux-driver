	type multi
	slaves {
		a {
			pcm "hw:Phase88"
			channels 12
		}
		b {
			pcm "hw:Phase88_1"
			channels 12
		}
	}
	bindings {
		0  { slave a channel 0 }
		1  { slave a channel 1 }
		2  { slave a channel 2 }
		3  { slave a channel 3 }
		4  { slave a channel 4 }
		5  { slave a channel 5 }
		6  { slave a channel 6 }
		7  { slave a channel 7 }
		8  { slave a channel 8 }
		9  { slave a channel 9 }
		10 { slave a channel 10 }
		11 { slave a channel 11 }
		12 { slave b channel 0 }
		13 { slave b channel 1 }
		14 { slave b channel 2 }
		15 { slave b channel 3 }
		16 { slave b channel 4 }
		17 { slave b channel 5 }
		18 { slave b channel 6 }
		19 { slave b channel 7 }
		20 { slave b channel 8 }
		21 { slave b channel 9 }
		22 { slave b channel 10 }
		23 { slave b channel 11 }
