# TerraTec PHASE 88: register the second MPU-401 UART of the Envy24 as well.
#
# The EEPROM advertises only one UART, so by default Linux shows one MIDI port
# per card, while Terratec's Windows driver shows two ("PHASE88 MIDI Port 1/2",
# ews88wdm.inf).  This makes /dev/snd/midiCxD1 appear too, so both DIN
# connectors can be tested with /root/terratec/scripts/phase88-midi-test.sh.
#
# Remove this file if the test shows the rack has only one MIDI IN/OUT: then
# the second UART is not wired to anything and should stay hidden.
options snd_ice1712 mpu401_2=1
